<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="apple-mobile-web-app-title" content="Chapters of Us" />
    <meta name="application-name" content="Chapters of Us" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Chapters of Us</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        /* A flat black letterbox reads as an unstyled iframe. A soft radial
           glow in the game's own palette, extending behind the canvas, makes
           the frame feel intentional instead of like empty margin. */
        background:
          radial-gradient(ellipse 90% 70% at 50% 42%, #241c33 0%, #140f1e 45%, #0a0810 78%, #060509 100%);
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        position: relative;
        isolation: isolate;
      }
      #app canvas {
        image-rendering: auto;
        border-radius: 0;
        box-shadow: none;
        max-width: 100dvw;
        max-height: 100dvh;
      }
      #orientation {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #app {
          filter: blur(10px) brightness(0.7) saturate(0.9);
          transform: scale(1.04);
        }
        #orientation {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          z-index: 10;
          color: #f5ecd8;
          background:
            radial-gradient(ellipse 80% 58% at 50% 34%, rgba(255, 217, 160, 0.16), transparent 58%),
            linear-gradient(180deg, rgba(9, 9, 17, 0.55), rgba(9, 9, 17, 0.9));
          padding: 28px;
          box-sizing: border-box;
        }
        .orientation-panel {
          width: min(318px, calc(100vw - 40px));
          box-sizing: border-box;
          border: 1px solid rgba(255, 217, 160, 0.28);
          border-radius: 8px;
          background: rgba(9, 9, 17, 0.72);
          box-shadow: 0 24px 90px rgba(0, 0, 0, 0.5);
          padding: 28px 22px 24px;
          text-align: center;
        }
        .orientation-icon {
          width: 82px;
          height: 52px;
          margin: 0 auto 20px;
          border: 3px solid #ffd9a0;
          border-radius: 12px;
          position: relative;
          transform: rotate(-8deg);
        }
        .orientation-icon::after {
          content: "";
          position: absolute;
          right: 8px;
          top: 50%;
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: #ffd9a0;
          transform: translateY(-50%);
        }
        .orientation-title {
          font-family: Georgia, "Times New Roman", serif;
          font-size: 30px;
          line-height: 1.1;
          margin: 0 0 10px;
          color: #ffd9a0;
        }
        .orientation-copy {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          font-size: 15px;
          line-height: 1.5;
          margin: 0;
          color: #d9d0bf;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="orientation" aria-hidden="true">
      <div class="orientation-panel">
        <div class="orientation-icon"></div>
        <p class="orientation-title">Turn for the full scene</p>
        <p class="orientation-copy">Chapters of Us is composed for landscape play, with touch movement and inspect controls ready on the next screen.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
